# ============================================================
# COMPRAS CELSA — Spring Boot config
# Todos los valores sensibles vienen de variables de entorno.
# Los defaults sirven para correr local con docker-compose.
# ============================================================

# ---- Datasource (modo LOCAL: conexión TCP directa al Postgres) ----
# En Cloud Run estas se ignoran: el profile `cloud` (application-cloud.properties)
# activa Spring Cloud GCP, que arma la DataSource sola.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5439/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=false

# Apaga starters de Spring Cloud GCP que se activan por classpath aunque no los uses.
# Sin esto, sus EnvironmentPostProcessor/AutoConfiguration intentan validar config
# o autenticarse contra GCP, lo cual falla en local.
# El profile `cloud` los reactiva donde corresponde.
spring.cloud.gcp.sql.enabled=false
spring.cloud.gcp.secretmanager.enabled=false

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ---- Mail (Gmail SMTP) ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:sistemcomprascelsa@gmail.com}
spring.mail.password=${MAIL_PASSWORD:CHANGE_ME_LOCAL_ONLY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- JWT ----
# Hex de 256 bits. Si no se setea env, falla en arranque (no usamos default por seguridad).
jwt.secret=${JWT_SECRET:}

# ---- Server ----
# Cloud Run inyecta PORT; local usa 8080.
server.port=${PORT:8080}

# ---- Servlet limits (subida de adjuntos) ----
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
