# ============================================================
# Profile: cloud
# Se activa con SPRING_PROFILES_ACTIVE=cloud en Cloud Run.
# Configura el datasource via Spring Cloud GCP (Cloud SQL Postgres).
# ============================================================

# Cloud SQL — Spring Cloud GCP arma la DataSource automáticamente
spring.cloud.gcp.sql.enabled=true
spring.cloud.gcp.sql.database-name=${DB_NAME}
spring.cloud.gcp.sql.instance-connection-name=${INSTANCE_CONNECTION_NAME}
spring.sql.init.platform=postgres

# Credenciales del usuario de DB (vienen de env vars / Secret Manager)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
