services:
  postgres-db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5439:5432"
    networks:
      - spring-network
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  springboot-app:
    build: .
    container_name: springboot-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    env_file:
      - .env
    environment:
      # Override de la URL para que apunte al contenedor postgres-db (no a localhost)
      DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME:-postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    networks:
      - spring-network

networks:
  spring-network:
