# ============================================================
# Cloud Run env vars file
# Cópialo a `env.production.yaml` y rellena con tus valores reales.
# El real está en .gitignore — NUNCA lo subas a git.
#
# Uso:  gcloud run deploy ... --env-vars-file=env.production.yaml
#       (o más simple:  bash deploy.sh)
#
# ⚠ Este archivo contiene secretos en texto plano. Quien tenga acceso
#   al repo local o rol `roles/run.viewer` en Cloud Run puede leerlos.
#   Para producción seria considera mover passwords y JWT_SECRET a
#   Secret Manager (--set-secrets).
# ============================================================

# Activa application-cloud.properties para que use Cloud SQL via socket privado.
SPRING_PROFILES_ACTIVE: cloud

# Cloud SQL — formato: PROJECT_ID:REGION:INSTANCE_ID
# Se obtiene con: gcloud sql instances describe celsa-db --format='value(connectionName)'
INSTANCE_CONNECTION_NAME: tu-proyecto:us-central1:celsa-db

# Database
DB_NAME: celsa
DB_USERNAME: celsa_app
DB_PASSWORD: pega_aqui_un_password_fuerte_para_postgres

# JWT — generar con: openssl rand -hex 32
JWT_SECRET: 545335351d1bfaad5204c6245a5d917740a9d9568d2f4747b63ea84fa89b0ba2

# Mail (Gmail SMTP)
